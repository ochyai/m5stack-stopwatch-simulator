[platformio]
default_envs = 10_sokkon
src_dir = firmware
test_dir = test

[c152]
platform = espressif32 @ 6.12.0
platform_packages = platformio/tool-esptoolpy @ 1.40501.0
board = esp32s3box
framework = arduino
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
upload_speed = 460800
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
lib_ldf_mode = deep+
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -Ifirmware/shared
lib_deps =
    m5stack/M5Unified@0.2.19
    m5stack/M5GFX@0.2.27
    m5stack/M5PM1@1.0.6
    m5stack/M5IOE1@1.0.8

[env:00_smoke]
extends = c152
build_src_filter = -<*> +<shared/> +<apps/00_smoke/>

[env:01_display_input]
extends = c152
build_src_filter = -<*> +<shared/> +<apps/01_display_input/>

[env:02_imu]
extends = c152
build_src_filter = -<*> +<shared/> +<apps/02_imu/>

[env:03_rtc_power]
extends = c152
build_src_filter = -<*> +<shared/> +<apps/03_rtc_power/>

[env:04_audio_haptics]
extends = c152
build_src_filter = -<*> +<shared/> +<apps/04_audio_haptics/>

[env:05_wifi_scan]
extends = c152
build_src_filter = -<*> +<shared/> +<apps/05_wifi_scan/>

[env:07_ble_gatt]
extends = c152
build_src_filter = -<*> +<shared/> +<apps/07_ble_gatt/>

[env:08_external_i2c]
extends = c152
build_src_filter = -<*> +<shared/> +<apps/08_external_i2c/>

[env:10_sokkon]
extends = c152
build_src_filter = -<*> +<shared/> +<apps/10_sokkon/>
build_unflags = -DCORE_DEBUG_LEVEL=5

[env:99_stopwatch]
extends = c152
build_src_filter = -<*> +<shared/> +<apps/99_stopwatch/>

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
test_filter = test_stopwatch_core
