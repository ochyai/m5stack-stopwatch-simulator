name: PlatformIO CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        environment:
          - "00_smoke"
          - "01_display_input"
          - "02_imu"
          - "03_rtc_power"
          - "04_audio_haptics"
          - "05_wifi_scan"
          - "07_ble_gatt"
          - "08_external_i2c"
          - "10_sokkon"
          - "99_stopwatch"
          - "native"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO Core
        run: python -m pip install "platformio==6.1.19"

      - name: Build environment
        if: matrix.environment != 'native'
        run: pio run --environment "${{ matrix.environment }}"

      # The simulator's committed font measurements come from this package, so
      # verify them on the one job that has it installed.
      - name: Check device font metrics
        if: matrix.environment == '10_sokkon'
        run: python3 scripts/generate-font-metrics.py --check

      - name: Run native unit tests
        if: matrix.environment == 'native'
        run: pio test --environment native

  companion:
    name: Test macOS companion logic
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run companion tests
        run: python -m unittest discover -s test_companion -v

  simulator:
    name: Test compiler-driven simulator
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile production SOKKON and run simulator tests
        run: make simulator-test

  workbench:
    name: Test Firmware Workbench
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: simulator/workbench/package-lock.json

      - name: Install Workbench dependencies
        run: npm ci --prefix simulator/workbench

      - name: Build Workbench
        run: npm --prefix simulator/workbench run build

      - name: Test Workbench transports and Sites package
        run: npm --prefix simulator/workbench run test:sites

  macos-simulator:
    name: Build native macOS simulator
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: simulator/workbench/package-lock.json

      - name: Install Workbench dependencies
        run: npm ci --prefix simulator/workbench

      - name: Build ad-hoc signed local app
        run: ./macos/M5StackSimulator/scripts/build-app.sh --skip-dependency-install --adhoc-sign

      - name: Verify app signature and bundle
        run: codesign --verify --deep --strict --verbose=2 "macos/M5StackSimulator/dist/M5Stack Simulator.app"

      - name: Build local DMG and checksum
        run: ./macos/M5StackSimulator/scripts/build-dmg.sh

      - name: Upload local simulator package
        uses: actions/upload-artifact@v4
        with:
          name: m5stack-simulator-local-${{ runner.arch }}
          path: |
            macos/M5StackSimulator/dist/*.dmg
            macos/M5StackSimulator/dist/*.sha256
