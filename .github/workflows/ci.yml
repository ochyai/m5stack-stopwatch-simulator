name: PlatformIO CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        environment:
          - "00_smoke"
          - "01_display_input"
          - "02_imu"
          - "03_rtc_power"
          - "04_audio_haptics"
          - "05_wifi_scan"
          - "07_ble_gatt"
          - "08_external_i2c"
          - "99_stopwatch"
          - "native"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO Core
        run: python -m pip install "platformio==6.1.19"

      - name: Build environment
        if: matrix.environment != 'native'
        run: pio run --environment "${{ matrix.environment }}"

      - name: Run native unit tests
        if: matrix.environment == 'native'
        run: pio test --environment native
